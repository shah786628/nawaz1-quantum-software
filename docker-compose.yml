version: '3.8'

services:
  nawaz1-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nawaz1-quantum-server
    restart: unless-stopped
    ports:
      - "8080:8080"  # REST API
      - "50051:50051"  # gRPC
    environment:
      - RUST_LOG=info
      - NAWAZ1_ENV=development
      - JWT_SECRET=nawaz1-docker-test-2026-secure-key-32chars
      - GITHUB_TELEMETRY_TOKEN=${GITHUB_TELEMETRY_TOKEN:-}
      - TELEMETRY_REPO_OWNER=shah786628
      - TELEMETRY_REPO_NAME=shah
    volumes:
      - ./data:/etc/nawaz1  # Persistent storage for attack logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - nawaz1-network

networks:
  nawaz1-network:
    driver: bridge
